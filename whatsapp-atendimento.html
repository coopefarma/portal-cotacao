<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coopefarma - Atendimento WhatsApp</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --verde:#15a563;--verde-escuro:#0d7a4a;--verde-light:#e8f5ee;
  --cinza:#f5f6fa;--borda:#e0e0e0;--texto:#222;--texto2:#666;
  --branco:#fff;--vermelho:#e53935;--azul:#1976d2;--laranja:#f57c00;
}
body{font-family:'Segoe UI',sans-serif;background:var(--cinza);color:var(--texto);height:100vh;overflow:hidden}

/* LOGIN */
#tela-login{display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#0d4a2a,#15a563)}
.login-box{background:var(--branco);border-radius:16px;padding:40px;width:360px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.login-box .logo{text-align:center;margin-bottom:24px}
.login-box .logo img{height:56px}
.login-box h2{text-align:center;color:var(--verde);font-size:1.3rem;margin-bottom:4px}
.login-box p{text-align:center;color:var(--texto2);font-size:.85rem;margin-bottom:24px}
.campo{margin-bottom:16px}
.campo label{display:block;font-size:.82rem;font-weight:600;color:var(--texto2);margin-bottom:6px}
.campo input{width:100%;padding:11px 14px;border:1.5px solid var(--borda);border-radius:8px;font-size:.95rem;outline:none;transition:.2s}
.campo input:focus{border-color:var(--verde)}
.btn-login{width:100%;padding:13px;background:var(--verde);color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:.2s;margin-top:4px}
.btn-login:hover{background:var(--verde-escuro)}
.msg-erro{color:var(--vermelho);font-size:.83rem;text-align:center;margin-top:12px;min-height:18px}

/* LAYOUT PRINCIPAL */
#app{display:none;height:100vh;flex-direction:column}
.topbar{background:var(--verde);color:#fff;padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topbar .marca{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}
.topbar .marca img{height:32px}
.topbar .info-user{display:flex;align-items:center;gap:14px;font-size:.88rem}
.badge-role{background:rgba(255,255,255,.2);padding:3px 10px;border-radius:12px;font-size:.78rem}
.badge-role.gestor{background:#fff;color:var(--verde);font-weight:700}
.btn-sair{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 14px;border-radius:6px;cursor:pointer;font-size:.83rem;transition:.2s}
.btn-sair:hover{background:rgba(255,255,255,.25)}

.corpo{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.sidebar{width:320px;background:var(--branco);border-right:1px solid var(--borda);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:14px 16px 10px;border-bottom:1px solid var(--borda)}
.sidebar-tabs{display:flex;gap:0;margin-bottom:12px}
.tab{flex:1;padding:8px 6px;font-size:.82rem;font-weight:600;color:var(--texto2);background:var(--cinza);border:none;cursor:pointer;transition:.2s;border-bottom:2px solid transparent}
.tab:first-child{border-radius:8px 0 0 8px}
.tab:last-child{border-radius:0 8px 8px 0}
.tab.ativo{background:var(--verde-light);color:var(--verde);border-bottom-color:var(--verde)}
.busca{position:relative}
.busca input{width:100%;padding:8px 12px 8px 32px;border:1.5px solid var(--borda);border-radius:8px;font-size:.85rem;outline:none}
.busca input:focus{border-color:var(--verde)}
.busca::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:.8rem}

.lista-conversas{flex:1;overflow-y:auto}
.lista-conversas::-webkit-scrollbar{width:4px}
.lista-conversas::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px}

.item-conversa{padding:12px 16px;border-bottom:1px solid var(--cinza);cursor:pointer;transition:.15s;position:relative}
.item-conversa:hover{background:#f9fffe}
.item-conversa.selecionado{background:var(--verde-light);border-left:3px solid var(--verde)}
.item-conversa .nome{font-weight:600;font-size:.9rem;color:var(--texto);margin-bottom:3px;display:flex;align-items:center;justify-content:space-between}
.item-conversa .hora{font-size:.74rem;color:var(--texto2)}
.item-conversa .preview{font-size:.82rem;color:var(--texto2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.item-conversa .status-badge{font-size:.7rem;padding:2px 7px;border-radius:10px;font-weight:600}
.status-badge.aguardando{background:#fff3e0;color:#e65100}
.status-badge.em_atendimento{background:#e8f5e9;color:#2e7d32}
.status-badge.finalizado{background:#f3f4f6;color:#777}
.nao-lidas-badge{background:var(--verde);color:#fff;font-size:.7rem;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}
.sem-conversas{padding:32px 16px;text-align:center;color:var(--texto2);font-size:.88rem}

/* AREA DE CHAT */
.chat-area{flex:1;display:flex;flex-direction:column;background:var(--cinza)}
.chat-vazio{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--texto2)}
.chat-vazio .icone{font-size:3.5rem;margin-bottom:16px;opacity:.4}
.chat-vazio p{font-size:.95rem}

.chat-header{background:var(--branco);padding:12px 20px;border-bottom:1px solid var(--borda);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.chat-header .contato{display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;flex-shrink:0}
.chat-header .contato-info h3{font-size:.98rem;font-weight:700}
.chat-header .contato-info p{font-size:.8rem;color:var(--texto2)}
.chat-acoes{display:flex;gap:8px;align-items:center}
.btn-acao{padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-size:.82rem;font-weight:600;transition:.2s}
.btn-assumir{background:var(--verde);color:#fff}
.btn-assumir:hover{background:var(--verde-escuro)}
.btn-finalizar{background:#fff;color:var(--vermelho);border:1.5px solid var(--vermelho)}
.btn-finalizar:hover{background:#fff5f5}
.btn-reabrir{background:#fff;color:var(--azul);border:1.5px solid var(--azul)}
.agente-label{font-size:.8rem;color:var(--texto2);background:var(--cinza);padding:5px 10px;border-radius:6px}

.chat-mensagens{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:8px}
.chat-mensagens::-webkit-scrollbar{width:4px}
.chat-mensagens::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px}

.msg-wrapper{display:flex;flex-direction:column}
.msg-wrapper.deles{align-items:flex-start}
.msg-wrapper.minha{align-items:flex-end}
.msg-bubble{max-width:68%;padding:9px 14px;border-radius:12px;font-size:.9rem;line-height:1.45;position:relative;word-break:break-word}
.msg-wrapper.deles .msg-bubble{background:var(--branco);border-radius:0 12px 12px 12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.msg-wrapper.minha .msg-bubble{background:#dcf8c6;border-radius:12px 12px 0 12px}
.msg-hora{font-size:.7rem;color:var(--texto2);margin-top:3px;padding:0 4px}
.msg-remetente{font-size:.72rem;color:var(--verde);font-weight:600;margin-bottom:2px;padding:0 4px}
.msg-data-divider{text-align:center;font-size:.75rem;color:var(--texto2);margin:12px 0;background:var(--cinza);padding:3px 0}

.chat-input-area{background:var(--branco);padding:12px 16px;border-top:1px solid var(--borda);display:flex;gap:10px;align-items:flex-end;flex-shrink:0}
.chat-input-area textarea{flex:1;border:1.5px solid var(--borda);border-radius:10px;padding:10px 14px;font-size:.92rem;resize:none;outline:none;max-height:120px;font-family:inherit;line-height:1.4}
.chat-input-area textarea:focus{border-color:var(--verde)}
.btn-enviar{background:var(--verde);color:#fff;border:none;border-radius:10px;width:44px;height:44px;cursor:pointer;font-size:1.2rem;transition:.2s;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.btn-enviar:hover{background:var(--verde-escuro)}
.btn-enviar:disabled{background:#ccc;cursor:not-allowed}
.chat-bloqueado{padding:12px 16px;text-align:center;font-size:.85rem;color:var(--texto2);background:var(--cinza);border-top:1px solid var(--borda)}

/* PAINEL GESTOR */
.gestor-stats{padding:16px 20px;background:var(--branco);border-bottom:1px solid var(--borda);display:flex;gap:16px;flex-shrink:0}
.stat-card{flex:1;background:var(--cinza);border-radius:10px;padding:12px 16px;text-align:center}
.stat-card .num{font-size:1.8rem;font-weight:700;color:var(--verde)}
.stat-card .label{font-size:.75rem;color:var(--texto2);margin-top:2px}
.stat-card.laranja .num{color:var(--laranja)}
.stat-card.azul .num{color:var(--azul)}

/* TOAST */
.toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:8px;color:#fff;font-size:.88rem;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:fadeIn .3s ease}
.toast.ok{background:#2e7d32}
.toast.err{background:#c62828}
.toast.info{background:#1565c0}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* LOADING */
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;z-index:999;display:none}
.spinner{width:36px;height:36px;border:3px solid var(--borda);border-top-color:var(--verde);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* RESPONSIVO */
@media(max-width:700px){
  .sidebar{width:100%;position:absolute;z-index:10;height:calc(100vh - 54px)}
  .sidebar.oculto{display:none}
}
</style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="tela-login">
  <div class="login-box">
    <div class="logo">
      <img src="https://raw.githubusercontent.com/coopefarma/portal-cotacao/main/Coopefarma_Marca_1.jpg" alt="Coopefarma" style="height:60px;object-fit:contain">
    </div>
    <h2>Atendimento WhatsApp</h2>
    <p>Entre com seu login para acessar</p>
    <div class="campo">
      <label>E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com" autocomplete="username">
    </div>
    <div class="campo">
      <label>Senha</label>
      <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-login" onclick="fazerLogin()">Entrar</button>
    <div class="msg-erro" id="msg-erro"></div>
  </div>
</div>

<!-- APP PRINCIPAL -->
<div id="app">
  <div class="topbar">
    <div class="marca">
      <img src="https://raw.githubusercontent.com/coopefarma/portal-cotacao/main/Coopefarma_Marca_1.jpg" alt="Coopefarma" style="height:32px;object-fit:contain">
      Atendimento WhatsApp
    </div>
    <div class="info-user">
      <span id="nome-usuario"></span>
      <span class="badge-role" id="badge-role">atendente</span>
      <button class="btn-sair" onclick="sair()">Sair</button>
    </div>
  </div>

  <!-- Stats gestor -->
  <div class="gestor-stats" id="gestor-stats" style="display:none">
    <div class="stat-card laranja">
      <div class="num" id="stat-aguardando">0</div>
      <div class="label">Aguardando</div>
    </div>
    <div class="stat-card">
      <div class="num" id="stat-atendimento">0</div>
      <div class="label">Em atendimento</div>
    </div>
    <div class="stat-card azul">
      <div class="num" id="stat-finalizados">0</div>
      <div class="label">Finalizados hoje</div>
    </div>
    <div class="stat-card">
      <div class="num" id="stat-agentes">0</div>
      <div class="label">Agentes online</div>
    </div>
  </div>

  <div class="corpo">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-tabs" id="sidebar-tabs">
          <!-- Tabs inseridas dinamicamente -->
        </div>
        <div class="busca">
          <input type="text" id="busca-input" placeholder="Buscar contato..." oninput="filtrarConversas()">
        </div>
      </div>
      <div class="lista-conversas" id="lista-conversas"></div>
    </div>

    <!-- AREA DE CHAT -->
    <div class="chat-area" id="chat-area">
      <div class="chat-vazio" id="chat-vazio">
        <div class="icone">💬</div>
        <p>Selecione uma conversa para atender</p>
      </div>
      <div id="chat-ativo" style="display:none;flex-direction:column;height:100%">
        <div class="chat-header">
          <div class="contato">
            <div class="avatar" id="chat-avatar">?</div>
            <div class="contato-info">
              <h3 id="chat-nome">—</h3>
              <p id="chat-telefone">—</p>
            </div>
          </div>
          <div class="chat-acoes" id="chat-acoes"></div>
        </div>
        <div class="chat-mensagens" id="chat-mensagens"></div>
        <div id="chat-input-wrapper">
          <div class="chat-input-area">
            <textarea id="msg-input" placeholder="Digite sua mensagem..." rows="1" onkeydown="teclaEnter(event)" oninput="autoResize(this)"></textarea>
            <button class="btn-enviar" id="btn-audio" onclick="toggleGravarAudio()" title="Gravar áudio" style="background:var(--cinza);color:var(--texto2);border:1.5px solid var(--borda)">🎤</button>
            <button class="btn-enviar" onclick="enviarMensagem()" id="btn-enviar">➤</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>
<div class="loading-overlay" id="loading"><div class="spinner"></div></div>

<script>
const SB_URL = 'https://uofcbqqbubvvltnzvhsx.supabase.co';
const SB_KEY = 'sb_publishable_SQ0x7RDU9B0u5lqvn2pr1Q_4NwoJMY9';
const { createClient } = supabase;
const sb = createClient(SB_URL, SB_KEY);

let _user = null;
let _agente = null;
let _conversas = [];
let _conversaAtiva = null;
let _tabAtiva = 'aguardando';
let _termoBusca = '';
let _subConversas = null;
let _subMensagens = null;

// ========================
// LOGIN
// ========================
document.addEventListener('keydown', e => {
  if(e.key==='Enter' && document.getElementById('tela-login').style.display !== 'none'){
    fazerLogin();
  }
});

async function fazerLogin() {
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  document.getElementById('msg-erro').textContent = '';
  if (!email || !senha) { document.getElementById('msg-erro').textContent = 'Preencha email e senha.'; return; }
  mostrarLoading(true);
  const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
  mostrarLoading(false);
  if (error) { document.getElementById('msg-erro').textContent = 'Email ou senha incorretos.'; return; }
  _user = data.user;
  await iniciarApp();
}

async function iniciarApp() {
  // Buscar perfil do agente
  const { data: agente } = await sb.from('wa_agentes').select('*').eq('user_id', _user.id).single();
  if (!agente) {
    document.getElementById('msg-erro').textContent = 'Seu usuário não tem perfil de atendente. Contate o gestor.';
    await sb.auth.signOut();
    return;
  }
  _agente = agente;

  // Marcar online
  await sb.from('wa_agentes').update({ online: true, ultima_atividade: new Date().toISOString() }).eq('id', agente.id);

  // UI
  document.getElementById('tela-login').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('nome-usuario').textContent = agente.nome;
  const badgeRole = document.getElementById('badge-role');
  badgeRole.textContent = agente.role === 'gestor' ? 'Gestor' : 'Atendente';
  if (agente.role === 'gestor') { badgeRole.classList.add('gestor'); document.getElementById('gestor-stats').style.display = 'flex'; }

  montarTabs();
  await carregarConversas();
  inscreverRealtime();
  atualizarStats();
}

async function sair() {
  if (_agente) await sb.from('wa_agentes').update({ online: false }).eq('id', _agente.id);
  if (_subConversas) _subConversas.unsubscribe();
  if (_subMensagens) _subMensagens.unsubscribe();
  await sb.auth.signOut();
  location.reload();
}

// ========================
// TABS
// ========================
function montarTabs() {
  const tabs = document.getElementById('sidebar-tabs');
  const isGestor = _agente.role === 'gestor';
  if (isGestor) {
    tabs.innerHTML = `
      <button class="tab ativo" onclick="trocarTab('aguardando',this)">Aguardando</button>
      <button class="tab" onclick="trocarTab('em_atendimento',this)">Em atend.</button>
      <button class="tab" onclick="trocarTab('todos',this)">Todos</button>`;
  } else {
    tabs.innerHTML = `
      <button class="tab ativo" onclick="trocarTab('aguardando',this)">Aguardando</button>
      <button class="tab" onclick="trocarTab('minhas',this)">Minhas</button>
      <button class="tab" onclick="trocarTab('finalizados',this)">Finalizados</button>`;
  }
}

function trocarTab(tab, el) {
  _tabAtiva = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('ativo'));
  el.classList.add('ativo');
  renderizarLista();
}

// ========================
// CONVERSAS
// ========================
async function carregarConversas() {
  const { data } = await sb.from('wa_conversas').select('*').order('ultima_mensagem_at', { ascending: false });
  _conversas = data || [];
  renderizarLista();
}

function renderizarLista() {
  const el = document.getElementById('lista-conversas');
  let lista = _conversas;

  // Filtrar por tab
  if (_tabAtiva === 'aguardando') lista = lista.filter(c => c.status === 'aguardando');
  else if (_tabAtiva === 'em_atendimento') lista = lista.filter(c => c.status === 'em_atendimento');
  else if (_tabAtiva === 'minhas') lista = lista.filter(c => c.agente_id === _user.id && c.status !== 'finalizado');
  else if (_tabAtiva === 'finalizados') lista = lista.filter(c => c.status === 'finalizado' && c.agente_id === _user.id);
  // 'todos' mostra tudo

  // Filtrar por busca
  if (_termoBusca) {
    const t = _termoBusca.toLowerCase();
    lista = lista.filter(c => (c.nome_contato||'').toLowerCase().includes(t) || c.telefone.includes(t));
  }

  if (lista.length === 0) {
    el.innerHTML = '<div class="sem-conversas">Nenhuma conversa aqui.</div>';
    return;
  }

  el.innerHTML = lista.map(c => {
    const ini = (c.nome_contato || c.telefone).charAt(0).toUpperCase();
    const hora = c.ultima_mensagem_at ? formatarHora(c.ultima_mensagem_at) : '';
    const ativo = _conversaAtiva?.id === c.id ? 'selecionado' : '';
    const naoLidas = c.nao_lidas > 0 ? `<span class="nao-lidas-badge">${c.nao_lidas}</span>` : '';
    return `
      <div class="item-conversa ${ativo}" onclick="abrirConversa('${c.id}')">
        <div class="nome">
          <span>${c.nome_contato || c.telefone}</span>
          <div style="display:flex;gap:6px;align-items:center">${naoLidas}<span class="hora">${hora}</span></div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:3px">
          <div class="preview">${c.ultima_mensagem || ''}</div>
          <span class="status-badge ${c.status}">${traduzirStatus(c.status)}</span>
        </div>
      </div>`;
  }).join('');
}

function filtrarConversas() {
  _termoBusca = document.getElementById('busca-input').value;
  renderizarLista();
}

function traduzirStatus(s) {
  return {aguardando:'Aguardando',em_atendimento:'Atendendo',finalizado:'Finalizado'}[s] || s;
}

function formatarHora(iso) {
  const d = new Date(iso);
  const hoje = new Date();
  if (d.toDateString() === hoje.toDateString()) return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
}

// ========================
// CHAT
// ========================
async function abrirConversa(id) {
  _conversaAtiva = _conversas.find(c => c.id === id);
  if (!_conversaAtiva) return;

  // Zerar nao_lidas
  if (_conversaAtiva.nao_lidas > 0) {
    await sb.from('wa_conversas').update({ nao_lidas: 0 }).eq('id', id);
    _conversaAtiva.nao_lidas = 0;
  }

  document.getElementById('chat-vazio').style.display = 'none';
  const chatAtivo = document.getElementById('chat-ativo');
  chatAtivo.style.display = 'flex';

  const nome = _conversaAtiva.nome_contato || _conversaAtiva.telefone;
  document.getElementById('chat-avatar').textContent = nome.charAt(0).toUpperCase();
  document.getElementById('chat-nome').textContent = nome;
  document.getElementById('chat-telefone').textContent = '+' + _conversaAtiva.telefone;

  renderizarAcoes();
  renderizarLista();
  await carregarMensagens(id);

  // Re-inscrever em mensagens desta conversa
  if (_subMensagens) _subMensagens.unsubscribe();
  _subMensagens = sb.channel('msgs-' + id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'wa_mensagens', filter: `conversa_id=eq.${id}` },
      payload => { adicionarMensagemNaTela(payload.new); })
    .subscribe();
}

function renderizarAcoes() {
  const el = document.getElementById('chat-acoes');
  const c = _conversaAtiva;
  const isGestor = _agente.role === 'gestor';
  const isMeu = c.agente_id === _user.id;
  let html = '';

  if (c.agente_id && c.agente_nome) {
    html += `<span class="agente-label">👤 ${c.agente_nome}</span>`;
  }

  if (c.status === 'aguardando') {
    html += `<button class="btn-acao btn-assumir" onclick="assumirConversa()">Assumir atendimento</button>`;
  } else if (c.status === 'em_atendimento') {
    if (isMeu || isGestor) {
      html += `<button class="btn-acao btn-finalizar" onclick="finalizarConversa()">Finalizar</button>`;
    }
  } else if (c.status === 'finalizado') {
    if (isGestor || isMeu) {
      html += `<button class="btn-acao btn-reabrir" onclick="reabrirConversa()">Reabrir</button>`;
    }
  }

  el.innerHTML = html;

  // Controle do input
  const wrapper = document.getElementById('chat-input-wrapper');
  const podeEnviar = (c.status === 'em_atendimento' && (isMeu || isGestor)) || isGestor;
  if (podeEnviar) {
    wrapper.innerHTML = `
      <div class="chat-input-area">
        <textarea id="msg-input" placeholder="Digite sua mensagem..." rows="1" onkeydown="teclaEnter(event)" oninput="autoResize(this)"></textarea>
        <button class="btn-enviar" id="btn-audio" onclick="toggleGravarAudio()" title="Gravar áudio" style="background:var(--cinza);color:var(--texto2);border:1.5px solid var(--borda)">🎤</button>
        <button class="btn-enviar" onclick="enviarMensagem()" id="btn-enviar">➤</button>
      </div>`;
  } else if (c.status === 'aguardando') {
    wrapper.innerHTML = `<div class="chat-bloqueado">Assuma a conversa para responder.</div>`;
  } else if (c.status === 'finalizado') {
    wrapper.innerHTML = `<div class="chat-bloqueado">Conversa finalizada. Reabra para continuar.</div>`;
  } else {
    wrapper.innerHTML = `<div class="chat-bloqueado">Esta conversa está sendo atendida por outro agente.</div>`;
  }
}

async function carregarMensagens(conversaId) {
  const el = document.getElementById('chat-mensagens');
  el.innerHTML = '<div style="text-align:center;color:#aaa;padding:20px">Carregando...</div>';
  const { data } = await sb.from('wa_mensagens').select('*').eq('conversa_id', conversaId).order('timestamp');
  el.innerHTML = '';
  (data || []).forEach(m => adicionarMensagemNaTela(m, false));
  el.scrollTop = el.scrollHeight;
}

function adicionarMensagemNaTela(msg, scroll = true) {
  const el = document.getElementById('chat-mensagens');
  if (!el) return;
  const lado = msg.de_mim ? 'minha' : 'deles';
  const hora = new Date(msg.timestamp).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const div = document.createElement('div');
  div.className = `msg-wrapper ${lado}`;
  div.dataset.msgId = msg.id;

  // Conteúdo da mensagem: imagem, áudio, vídeo, documento ou texto
  let conteudoHtml = '';
  if (msg.media_tipo === 'imagem' && msg.media_url) {
    conteudoHtml = `<img src="${msg.media_url}" style="max-width:240px;max-height:240px;border-radius:8px;display:block;cursor:pointer" onclick="window.open('${msg.media_url}','_blank')">`;
    if (msg.conteudo && msg.conteudo !== '[Imagem]') conteudoHtml += `<div style="margin-top:4px">${escapeHtml(msg.conteudo)}</div>`;
  } else if (msg.media_tipo === 'audio' && msg.media_url) {
    conteudoHtml = `<audio controls style="max-width:220px;outline:none"><source src="${msg.media_url}" type="audio/ogg"><source src="${msg.media_url}" type="audio/mpeg"><span>🎵 ${escapeHtml(msg.conteudo)}</span></audio>`;
  } else if (msg.media_tipo === 'video' && msg.media_url) {
    conteudoHtml = `<video controls style="max-width:240px;border-radius:8px"><source src="${msg.media_url}"><span>${escapeHtml(msg.conteudo)}</span></video>`;
  } else if (msg.media_tipo === 'documento' && msg.media_url) {
    const nome = escapeHtml(msg.conteudo);
    const isPdf = msg.media_url.toLowerCase().includes('.pdf') || nome.toLowerCase().includes('.pdf');
    if (isPdf) {
      conteudoHtml = `<div style="display:flex;flex-direction:column;gap:6px">
        <a href="${msg.media_url}" target="_blank" style="display:flex;align-items:center;gap:8px;color:var(--azul);text-decoration:none">
          <span style="font-size:1.6rem">📄</span><span style="text-decoration:underline">${nome}</span>
        </a>
        <iframe src="${msg.media_url}" style="width:260px;height:180px;border:1px solid var(--borda);border-radius:6px" title="${nome}"></iframe>
      </div>`;
    } else {
      conteudoHtml = `<a href="${msg.media_url}" target="_blank" style="display:flex;align-items:center;gap:8px;color:var(--azul);text-decoration:none">
        <span style="font-size:1.6rem">📎</span><span style="text-decoration:underline">${nome}</span>
      </a>`;
    }
  } else {
    conteudoHtml = escapeHtml(msg.conteudo);
  }

  div.innerHTML = `
    ${!msg.de_mim && msg.remetente_nome ? `<div class="msg-remetente">${msg.remetente_nome}</div>` : ''}
    <div class="msg-bubble">${conteudoHtml}</div>
    <div class="msg-hora">${hora}${msg.de_mim ? ' ✓' : ''}</div>`;
  el.appendChild(div);
  if (scroll) el.scrollTop = el.scrollHeight;
}

async function assumirConversa() {
  await sb.from('wa_conversas').update({
    status: 'em_atendimento',
    agente_id: _user.id,
    agente_nome: _agente.nome,
  }).eq('id', _conversaAtiva.id);
  _conversaAtiva.status = 'em_atendimento';
  _conversaAtiva.agente_id = _user.id;
  _conversaAtiva.agente_nome = _agente.nome;
  renderizarAcoes();
  renderizarLista();
  toast('Conversa assumida!', 'ok');
}

async function finalizarConversa() {
  await sb.from('wa_conversas').update({ status: 'finalizado' }).eq('id', _conversaAtiva.id);
  _conversaAtiva.status = 'finalizado';
  renderizarAcoes();
  renderizarLista();
  toast('Conversa finalizada.', 'info');
}

async function reabrirConversa() {
  await sb.from('wa_conversas').update({ status: 'em_atendimento' }).eq('id', _conversaAtiva.id);
  _conversaAtiva.status = 'em_atendimento';
  renderizarAcoes();
  renderizarLista();
  toast('Conversa reaberta.', 'ok');
}

async function enviarMensagem() {
  const input = document.getElementById('msg-input');
  const texto = input?.value?.trim();
  if (!texto || !_conversaAtiva) return;
  const btn = document.getElementById('btn-enviar');
  if (btn) btn.disabled = true;
  input.value = '';
  input.style.height = 'auto';

  await sb.from('wa_fila_envio').insert({
    conversa_id: _conversaAtiva.id,
    telefone: _conversaAtiva.telefone,
    conteudo: texto,
  });

  if (btn) btn.disabled = false;
  input?.focus();
}

function teclaEnter(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviarMensagem(); }
}
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }

// ========================
// GRAVAÇÃO DE ÁUDIO
// ========================
let _mediaRecorder = null;
let _audioChunks = [];
let _gravando = false;

async function toggleGravarAudio() {
  if (_gravando) {
    pararGravacao();
  } else {
    await iniciarGravacao();
  }
}

async function iniciarGravacao() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    _audioChunks = [];
    _mediaRecorder = new MediaRecorder(stream);
    _mediaRecorder.ondataavailable = e => { if (e.data.size > 0) _audioChunks.push(e.data); };
    _mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      await enviarAudioGravado();
    };
    _mediaRecorder.start();
    _gravando = true;
    const btn = document.getElementById('btn-audio');
    if (btn) { btn.textContent = '⏹'; btn.style.background = '#e53935'; btn.style.color = '#fff'; btn.style.border = 'none'; btn.title = 'Parar gravação'; }
    toast('Gravando... clique em ⏹ para parar.', 'ok');
  } catch (err) {
    toast('Erro ao acessar microfone.', 'erro');
  }
}

function pararGravacao() {
  if (_mediaRecorder && _gravando) {
    _mediaRecorder.stop();
    _gravando = false;
    const btn = document.getElementById('btn-audio');
    if (btn) { btn.textContent = '🎤'; btn.style.background = 'var(--cinza)'; btn.style.color = 'var(--texto2)'; btn.style.border = '1.5px solid var(--borda)'; btn.title = 'Gravar áudio'; }
  }
}

async function enviarAudioGravado() {
  if (!_conversaAtiva || _audioChunks.length === 0) return;
  const blob = new Blob(_audioChunks, { type: 'audio/ogg; codecs=opus' });
  try {
    const nomeArquivo = `audio-${Date.now()}.ogg`;

    // Upload usando o cliente sb já inicializado
    const { data: uploadData, error: uploadError } = await sb.storage
      .from('wa-midia')
      .upload(nomeArquivo, blob, { contentType: 'audio/ogg', upsert: false });

    if (uploadError) throw new Error('Upload: ' + uploadError.message);

    const { data: { publicUrl } } = sb.storage.from('wa-midia').getPublicUrl(uploadData.path);

    // Salvar mensagem de áudio no banco (para aparecer na tela)
    await sb.from('wa_mensagens').insert({
      conversa_id: _conversaAtiva.id,
      conteudo: '[Audio]',
      de_mim: true,
      remetente_nome: _agente?.nome || 'Atendente',
      media_tipo: 'audio',
      media_url: publicUrl,
      timestamp: new Date().toISOString(),
    });

    // Inserir na fila para o servidor enviar ao WhatsApp
    await sb.from('wa_fila_envio').insert({
      conversa_id: _conversaAtiva.id,
      telefone: _conversaAtiva.telefone,
      conteudo: '[Audio]',
      media_url: publicUrl,
      media_tipo: 'audio',
    });

    toast('Áudio enviado!', 'ok');
  } catch (err) {
    console.error('Erro ao enviar áudio:', err);
    toast('Erro ao enviar áudio: ' + err.message, 'erro');
  }
}

// ========================
// REALTIME
// ========================
function inscreverRealtime() {
  _subConversas = sb.channel('conversas-global')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'wa_conversas' }, payload => {
      const idx = _conversas.findIndex(c => c.id === payload.new?.id);
      if (payload.eventType === 'INSERT') {
        _conversas.unshift(payload.new);
      } else if (payload.eventType === 'UPDATE') {
        if (idx >= 0) _conversas[idx] = payload.new;
        if (_conversaAtiva?.id === payload.new.id) {
          _conversaAtiva = payload.new;
          renderizarAcoes();
        }
      }
      renderizarLista();
      atualizarStats();
    })
    .subscribe();
}

// ========================
// STATS (GESTOR)
// ========================
async function atualizarStats() {
  if (_agente?.role !== 'gestor') return;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  document.getElementById('stat-aguardando').textContent = _conversas.filter(c => c.status === 'aguardando').length;
  document.getElementById('stat-atendimento').textContent = _conversas.filter(c => c.status === 'em_atendimento').length;
  document.getElementById('stat-finalizados').textContent = _conversas.filter(c => c.status === 'finalizado' && new Date(c.ultima_mensagem_at) >= hoje).length;
  const { data: agentes } = await sb.from('wa_agentes').select('*').eq('online', true);
  document.getElementById('stat-agentes').textContent = (agentes || []).length;
}

// ========================
// UTILS
// ========================
function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
function toast(msg, tipo = 'ok') {
  const c = document.getElementById('toasts');
  const d = document.createElement('div');
  d.className = `toast ${tipo}`;
  d.textContent = msg;
  c.appendChild(d);
  setTimeout(() => d.remove(), 3500);
}
function mostrarLoading(v) { document.getElementById('loading').style.display = v ? 'flex' : 'none'; }

// Verificar sessao ativa ao carregar
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { _user = session.user; await iniciarApp(); }
})();

// Marcar offline ao fechar
window.addEventListener('beforeunload', async () => {
  if (_agente) await sb.from('wa_agentes').update({ online: false }).eq('id', _agente.id);
});
</script>
